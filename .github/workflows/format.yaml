name: Auto-format Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'ci-approval' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}  # Important for pull requests
      
      - uses: pachadotdev/clang-format@v1.1
        with:
          version: '21'
          files: 'inst/include/cpp4r.hpp inst/include/cpp4r/*.hpp'
          auto-commit: true
          commit-message: 'style: auto-format C++ code'
